[package]
name = "cairn-ai"
description = "Durable, governed, model-agnostic agents in Rust."
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[lib]
name = "cairn"

[dependencies]
cairn-runtime.workspace = true
cairn-models.workspace = true
cairn-journal-postgres = { workspace = true, optional = true }
cairn-ai-mcp = { workspace = true, optional = true }
cairn-ai-a2a = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
postgres = ["dep:cairn-journal-postgres"]
mcp = ["dep:cairn-ai-mcp"]
a2a = ["dep:cairn-ai-a2a"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tracing-subscriber", "dep:tracing"]

[dev-dependencies]
axum.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
