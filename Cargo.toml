[workspace]
resolver = "3"
members = ["crates/cairn-runtime", "crates/cairn-models", "crates/cairn-ai", "crates/cairn-cli", "crates/cairn-gateway"]

[workspace.package]
version = "0.1.0"
authors = ["Aaron David Charles"]
homepage = "https://charlesaarondavid.com"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
cairn-runtime = { path = "crates/cairn-runtime" }
cairn-models = { path = "crates/cairn-models" }
cairn-ai = { path = "crates/cairn-ai" }
cairn-gateway = { path = "crates/cairn-gateway" }

async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
