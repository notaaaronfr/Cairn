[workspace]
resolver = "3"
members = ["crates/cairn-runtime", "crates/cairn-models", "crates/cairn-ai", "crates/cairn-cli", "crates/cairn-gateway", "crates/cairn-journal-postgres", "crates/cairn-mcp"]

[workspace.package]
version = "0.1.0"
authors = ["Aaron David Charles"]
homepage = "https://github.com/whatstask/Cairn"
repository = "https://github.com/whatstask/Cairn"
keywords = ["ai", "agents", "llm", "durable-execution", "mcp"]
categories = ["asynchronous", "development-tools", "web-programming"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
cairn-runtime = { path = "crates/cairn-runtime", version = "0.1.0" }
cairn-models = { path = "crates/cairn-models", version = "0.1.0" }
cairn-ai = { path = "crates/cairn-ai", version = "0.1.0" }
cairn-gateway = { path = "crates/cairn-gateway", version = "0.1.0" }
cairn-journal-postgres = { path = "crates/cairn-journal-postgres", version = "0.1.0" }
cairn-ai-mcp = { path = "crates/cairn-mcp", version = "0.1.0" }

async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
jsonschema = { version = "0.60", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono"] }
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
